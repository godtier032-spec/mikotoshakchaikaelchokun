name: Build Windows exe
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          pip install -r requirements.txt pyinstaller
          python posture_shimeji.py --make-icon icon.ico
          pyinstaller --noconfirm --clean --onefile --windowed --name PostureShimeji --icon icon.ico --collect-all mediapipe posture_shimeji.py
      - run: |
          Start-Process -FilePath dist\PostureShimeji.exe -ArgumentList "--selftest" -Wait
          Get-Content "$env:APPDATA\PostureShimeji\selftest.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: PostureShimeji-windows
          path: dist/PostureShimeji.exe
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PostureShimeji.exe
